x-backend-env: &backend-env
  env_file:
    - path: .env.production.example
      required: true
    - path: .env.production
      required: false

services:
  backend-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: stockproject-backend:local
    <<: *backend-env
    command: ["uv", "run", "alembic", "upgrade", "head"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  backend-api:
    image: stockproject-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    <<: *backend-env
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    expose:
      - "8000"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/liveness', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  watchlist-worker:
    image: stockproject-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    <<: *backend-env
    command: ["uv", "run", "python", "scripts/run_watchlist_worker.py"]
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  analysis-worker:
    image: stockproject-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    <<: *backend-env
    command: ["uv", "run", "python", "scripts/run_analysis_worker.py"]
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend-nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: stockproject-frontend:local
    ports:
      - "8080:80"
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped
